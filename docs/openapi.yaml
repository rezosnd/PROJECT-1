              total: { type: integer }
              occupied: { type: integer }
              reserved: { type: integer }
              cleaning: { type: integer }
              maintenance: { type: integer }
              free: { type: integer, description: 'Derived: total - occupied - reserved - cleaning - maintenance' }
              has_ventilator_beds: { type: integer }
              version: { type: integer }

    AdjustBedCountersInput:
      type: object
      properties:
        total: { type: integer }
        occupied: { type: integer }
        reserved: { type: integer }
        cleaning: { type: integer }
        maintenance: { type: integer }
        reason: { type: string }

    PutBedCountersInput:
      type: object
      required: [total, occupied, reserved, cleaning, maintenance]
      properties:
        total: { type: integer, minimum: 0 }
        occupied: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        cleaning: { type: integer, minimum: 0 }
        maintenance: { type: integer, minimum: 0 }
        hasVentilatorBeds: { type: integer, minimum: 0 }
